services:
  db:
    image: postgres:16-alpine
    container_name: onoso4circus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Solo localhost: en el VPS de producción evita exponer Postgres a
      # internet aunque el firewall falle; en local no cambia nada.
      - '127.0.0.1:${DB_PORT}:5432'
    volumes:
      - onoso4circus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  onoso4circus_postgres_data:
